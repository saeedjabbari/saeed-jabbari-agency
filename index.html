    <div id="root"></div>

    <script>
      // Global image path fallback for GitHub Pages root (main branch)
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          if (
            target &&
            target.tagName === 'IMG' &&
            target.src &&
            target.src.indexOf('/assets/') !== -1 &&
            target.src.indexOf('/public/assets/') === -1
          ) {
            target.src = target.src.replace('/assets/', '/public/assets/');
          }
        },
        true
      );

      // Lightweight fallback: If /src/main.tsx fails (e.g. static root hosting on GitHub Pages without dev server)
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          if (
            target &&
            target.tagName === 'SCRIPT' &&
            target.src &&
            target.src.indexOf('/src/main.tsx') !== -1
          ) {
            if (!document.querySelector('script[data-prebundled]')) {
              var script = document.createElement('script');
              script.type = 'module';
              script.src = './assets/app.js';
              script.setAttribute('data-prebundled', 'true');
              document.head.appendChild(script);

              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './assets/index.css';
              document.head.appendChild(link);
            }
          }
        },
        true
      );
    </script>
